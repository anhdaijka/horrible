name: Finalize Chapter 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-chapter-01.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark approved manuscript final
        run: |
          for f in chapters/chapter-01.md scenes/chapter-01-scene-01.md scenes/chapter-01-scene-02.md scenes/chapter-01-scene-03.md scenes/chapter-01-scene-04.md; do
            sed -i '0,/status: draft/s//status: final/' "$f"
          done
      - name: Commit
        run: |
          git config user.name "Phùng Quang Anh"
          git config user.email "84665790+anhdaijka@users.noreply.github.com"
          git add chapters/chapter-01.md scenes/chapter-01-scene-0*.md
          git commit -m "canon: finalize chapter 1 manuscript"
          git push
