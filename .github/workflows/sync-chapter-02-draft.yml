name: Sync Chapter 2 draft metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-chapter-02-draft.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync counts and registries
        run: |
          sed -i 's/word-count: 3063/word-count: 2978/' chapters/chapter-01.md
          sed -i 's/word-count: 2538/word-count: 2511/' chapters/chapter-02.md
          cat > chapters/_index.md <<'EOF'
          ---
          type: chapter-registry
          story: horrible
          ---

          # Chapters

          ## Registry

          | # | Title | POV | Status | Word Count | File |
          |---|---|---|---|---|---|
          | 1 | Tiếng chợ | Nguyễn Minh Khanh | final | 2978 | [chapter-01](chapter-01.md) |
          | 2 | Người đặt | Nguyễn Minh Khanh | draft | 2511 | [chapter-02](chapter-02.md) |

          ## Total Word Count: 5489
          EOF
          cat > scenes/_index.md <<'EOF'
          ---
          type: scene-registry
          story: horrible
          ---

          # Scenes

          | Scene | Chapter | POV | Location | Status | File |
          |---|---|---|---|---|---|
          | 1.1 | chapter-01 | Nguyễn Minh Khanh | family-votive-shop | final | [chapter-01-scene-01](chapter-01-scene-01.md) |
          | 1.2 | chapter-01 | Nguyễn Minh Khanh | family-votive-shop | final | [chapter-01-scene-02](chapter-01-scene-02.md) |
          | 1.3 | chapter-01 | Nguyễn Minh Khanh | market-crossroads | final | [chapter-01-scene-03](chapter-01-scene-03.md) |
          | 1.4 | chapter-01 | Nguyễn Minh Khanh | family-votive-shop | final | [chapter-01-scene-04](chapter-01-scene-04.md) |
          | 2.1 | chapter-02 | Nguyễn Minh Khanh | family-votive-shop | draft | [chapter-02-scene-01](chapter-02-scene-01.md) |
          | 2.2 | chapter-02 | Nguyễn Minh Khanh | family-votive-shop | draft | [chapter-02-scene-02](chapter-02-scene-02.md) |
          | 2.3 | chapter-02 | Nguyễn Minh Khanh | family-votive-shop | draft | [chapter-02-scene-03](chapter-02-scene-03.md) |
          EOF
      - name: Commit
        run: |
          git config user.name "Phùng Quang Anh"
          git config user.email "84665790+anhdaijka@users.noreply.github.com"
          git add chapters scenes
          git commit -m "chore: sync chapter 2 draft metadata"
          git push
